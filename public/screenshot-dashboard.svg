<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" width="1280" height="760" role="img" aria-label="Captura de pantalla del informe ejecutivo, gráficas de radar multidimensional y exportación académica a PDF">
  <defs>
