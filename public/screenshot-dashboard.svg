    <text x="108" y="-28" text-anchor="start" fill="#0F2C59" class="sans" font-size="10.5" font-weight="600">D2 · Automatización (78)</text>
    <text x="72" y="104" text-anchor="middle" fill="#0F2C59" class="sans" font-size="10.5" font-weight="600">D3 · Viabilidad (74)</text>
    <text x="-72" y="104" text-anchor="middle" fill="#0F2C59" class="sans" font-size="10.5" font-weight="600">D4 · Productividad (82)</text>
    <text x="-108" y="-28" text-anchor="end" fill="#0F2C59" class="sans" font-size="10.5" font-weight="600">D5 · Rigor crítico (80)</text>
