<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&amp;display=swap');
      .font-main { font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    </style>

    <!-- Background Aurora Gradients -->
    <radialGradient id="auroraBlue" cx="15%" cy="20%" r="45%">
      <stop offset="0%" stop-color="#007BFF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#007BFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="auroraTeal" cx="85%" cy="85%" r="45%">
      <stop offset="0%" stop-color="#1abc9c" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#1abc9c" stop-opacity="0"/>
    </radialGradient>

    <!-- Brand Gradients -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#007BFF"/>
      <stop offset="100%" stop-color="#1abc9c"/>
    </linearGradient>
    <linearGradient id="progressGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#007BFF"/>
      <stop offset="100%" stop-color="#1abc9c"/>
    </linearGradient>
    <linearGradient id="btnPrimaryGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#007BFF"/>
      <stop offset="100%" stop-color="#0056b3"/>
    </linearGradient>

    <!-- Soft Shadows -->
    <filter id="shadowMd" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
    <filter id="shadowSm" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000000" flood-opacity="0.05"/>
    </filter>
    <filter id="iconGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#007BFF" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Browser Window Frame -->
  <rect width="1200" height="780" rx="14" fill="#F8F9FA" stroke="#dee2e6" stroke-width="2"/>
  <rect width="1200" height="780" rx="14" fill="url(#auroraBlue)"/>
  <rect width="1200" height="780" rx="14" fill="url(#auroraTeal)"/>

  <!-- Browser Top Bar -->
  <path d="M 0 14 Q 0 0 14 0 L 1186 0 Q 1200 0 1200 14 L 1200 44 L 0 44 Z" fill="#ffffff" stroke="#e9ecef" stroke-width="1"/>
  <circle cx="24" cy="22" r="6" fill="#ff5f56"/>
  <circle cx="44" cy="22" r="6" fill="#ffbd2e"/>
  <circle cx="64" cy="22" r="6" fill="#27c93f"/>
  <rect x="340" y="10" width="520" height="24" rx="6" fill="#f1f3f5"/>
  <text x="600" y="26" text-anchor="middle" class="font-main" font-size="11" font-weight="500" fill="#6c757d">localhost:3000 — Evaluación de impacto: IAGen</text>

  <!-- Main Container (Centered 860px wide) -->
  <g transform="translate(170, 68)" class="font-main">

    <!-- Header Glass Panel -->
    <rect x="0" y="0" width="860" height="196" rx="16" fill="#ffffff" fill-opacity="0.78" stroke="#ffffff" stroke-width="1.5" filter="url(#shadowMd)"/>

    <!-- Header Icon Circle -->
    <circle cx="430" cy="48" r="28" fill="url(#brandGrad)" filter="url(#iconGlow)"/>
    <text x="430" y="57" text-anchor="middle" font-size="26">🧠</text>

    <!-- Title & Subtitle -->
    <text x="430" y="106" text-anchor="middle" font-size="26" font-weight="700" fill="#212529">Evaluación de impacto: IAGen</text>
    <text x="430" y="132" text-anchor="middle" font-size="13.5" font-weight="400" fill="#6c757d">Herramienta de análisis académico para evaluar el potencial impacto de la inteligencia artificial generativa.</text>

    <!-- Status Indicators -->
    <g transform="translate(285, 148)">
      <rect x="0" y="0" width="138" height="30" rx="15" fill="#ffffff" fill-opacity="0.8" stroke="#28a745" stroke-width="1.2"/>
      <text x="69" y="19" text-anchor="middle" font-size="11.5" font-weight="600" fill="#28a745">🤖 IA configurada</text>

      <rect x="152" y="0" width="138" height="30" rx="15" fill="#ffffff" fill-opacity="0.8" stroke="#007BFF" stroke-width="1.2"/>
      <text x="221" y="19" text-anchor="middle" font-size="11.5" font-weight="600" fill="#00529B">💾 Guardado local</text>
    </g>

    <!-- Progress Section Glass Panel -->
    <g transform="translate(0, 214)">
      <rect x="0" y="0" width="860" height="72" rx="16" fill="#ffffff" fill-opacity="0.78" stroke="#ffffff" stroke-width="1.5" filter="url(#shadowMd)"/>
      <text x="28" y="28" font-size="13" font-weight="600" fill="#212529">Progreso de la evaluación</text>
      <text x="832" y="28" text-anchor="end" font-size="13" font-weight="600" fill="#212529">1 de 4</text>

      <!-- Progress Bar -->
      <rect x="28" y="42" width="804" height="10" rx="5" fill="#000000" fill-opacity="0.06"/>
      <rect x="28" y="42" width="201" height="10" rx="5" fill="url(#progressGrad)"/>
    </g>

    <!-- Step Content Glass Panel -->
    <g transform="translate(0, 304)">
      <rect x="0" y="0" width="860" height="338" rx="16" fill="#ffffff" fill-opacity="0.82" stroke="#ffffff" stroke-width="1.5" filter="url(#shadowMd)"/>

      <!-- Step Header -->
      <g transform="translate(32, 26)">
        <!-- User Profile SVG Icon -->
        <g transform="translate(4, 4)" stroke="#007BFF" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <path d="M28 31v-3a6 6 0 0 0-6-6H10a6 6 0 0 0-6 6v3"/>
          <circle cx="16" cy="10" r="6"/>
        </g>
        <text x="54" y="19" font-size="20" font-weight="700" fill="#212529">Perfil profesional y contexto laboral</text>
        <text x="54" y="39" font-size="12.5" font-weight="600" fill="#007BFF">Sección 1 de 4</text>
        <line x1="0" y1="56" x2="796" y2="56" stroke="#000000" stroke-opacity="0.08" stroke-width="1"/>
      </g>

      <!-- Question 1 -->
      <g transform="translate(32, 102)">
        <text x="0" y="16" font-size="14.5" font-weight="600" fill="#212529">¿En qué sector profesional te desempeñas?</text>
        <rect x="0" y="28" width="796" height="42" rx="8" fill="#ffffff" stroke="#007BFF" stroke-width="1.5"/>
        <text x="16" y="54" font-size="13.5" font-weight="500" fill="#343a40">Educación e investigación</text>
        <path d="M 770 46 L 776 52 L 782 46" stroke="#495057" stroke-width="1.8" fill="none" stroke-linecap="round"/>
        <line x1="0" y1="86" x2="796" y2="86" stroke="#000000" stroke-opacity="0.08" stroke-width="1"/>
      </g>

      <!-- Question 2 -->
      <g transform="translate(32, 204)">
        <text x="0" y="16" font-size="14.5" font-weight="600" fill="#212529">Describe tu rol principal y las tareas que realizas habitualmente</text>
        <rect x="0" y="28" width="796" height="68" rx="8" fill="#ffffff" fill-opacity="0.9" stroke="#000000" stroke-opacity="0.12" stroke-width="1"/>
        <text x="16" y="52" font-size="13" font-weight="400" fill="#495057">Docencia universitaria, investigación académica, revisión bibliográfica sistematizada y</text>
        <text x="16" y="72" font-size="13" font-weight="400" fill="#495057">redacción de artículos científicos e informes de proyectos.</text>
      </g>
    </g>

    <!-- Navigation Buttons -->
    <g transform="translate(0, 658)">
      <rect x="0" y="0" width="136" height="42" rx="8" fill="#ffffff" fill-opacity="0.6" stroke="#000000" stroke-opacity="0.1" stroke-width="1"/>
      <text x="68" y="26" text-anchor="middle" font-size="13" font-weight="600" fill="#adb5bd">← Anterior</text>

      <rect x="345" y="0" width="170" height="42" rx="8" fill="#1abc9c" filter="url(#shadowSm)"/>
      <text x="430" y="26" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">💾 Guardar progreso</text>

      <rect x="720" y="0" width="140" height="42" rx="8" fill="url(#btnPrimaryGrad)" filter="url(#shadowSm)"/>
      <text x="790" y="26" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">Siguiente →</text>
    </g>

  </g>
</svg>
