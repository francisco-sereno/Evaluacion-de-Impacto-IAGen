<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;family=Plus+Jakarta+Sans:wght@600;700&amp;display=swap');
      .font-display { font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif; }
      .font-sans { font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif; }
      .font-mono { font-family: 'IBM Plex Mono', monospace; }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1280" height="800" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>

  <!-- Top Bar (3-Zone Contract) -->
  <rect x="0" y="0" width="1280" height="60" fill="#FFFFFF"/>
  <line x1="0" y1="60" x2="1280" y2="60" stroke="#E2E8F0" stroke-width="1"/>

  <text x="64" y="36" class="font-display" font-size="17" font-weight="700" fill="#0F172A">Evaluación IAGen</text>

  <!-- Nav Links -->
  <g class="font-sans" font-size="13.5" font-weight="500">
    <text x="480" y="36" fill="#0F172A" font-weight="600">Diagnóstico</text>
    <line x1="480" y1="45" x2="558" y2="45" stroke="#0284C7" stroke-width="2"/>
    <text x="590" y="36" fill="#475569">Informe ejecutivo</text>
    <text x="732" y="36" fill="#475569">Visualización</text>
    <text x="846" y="36" fill="#475569">Metodología</text>
  </g>

  <!-- Primary CTA -->
  <rect x="1056" y="15" width="160" height="32" rx="7" fill="#0284C7"/>
  <text x="1136" y="35" text-anchor="middle" class="font-sans" font-size="12" font-weight="600" fill="#FFFFFF">Generar diagnóstico</text>

  <!-- Editorial Workspace Header -->
  <g transform="translate(64, 92)">
    <text x="0" y="12" class="font-sans" font-size="11.5" fill="#64748B">Diagnóstico académico y profesional  ·  Motor Gemini 2.5 activo  ·  Almacenamiento local privado</text>
    <text x="0" y="46" class="font-display" font-size="28" font-weight="700" fill="#0F172A">Evaluación de impacto: IAGen en el día a día</text>
    <text x="0" y="72" class="font-sans" font-size="13.5" fill="#475569">Instrumento de análisis crítico para dimensionar oportunidades de automatización, brechas de competencias y riesgos éticos.</text>

    <!-- Secondary Toolbar -->
    <rect x="890" y="42" width="164" height="32" rx="7" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="972" y="62" text-anchor="middle" class="font-sans" font-size="11.5" font-weight="500" fill="#334155">Cargar caso de ejemplo</text>

    <rect x="1064" y="42" width="88" height="32" rx="7" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="1108" y="62" text-anchor="middle" class="font-sans" font-size="11.5" font-weight="500" fill="#475569">Reiniciar</text>

    <line x1="0" y1="98" x2="1152" y2="98" stroke="#E2E8F0" stroke-width="1"/>
  </g>

  <!-- Two-Zone Workspace Grid -->
  <g transform="translate(64, 214)">

    <!-- Left Rail (350px) -->
    <g>
      <!-- Stepper Card -->
      <rect x="0" y="0" width="350" height="252" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
      <text x="24" y="32" class="font-sans" font-size="12" font-weight="600" fill="#0F172A">Progreso del cuestionario</text>
      <text x="326" y="32" text-anchor="end" class="font-mono" font-size="12" font-weight="500" fill="#475569">01 / 04</text>

      <rect x="24" y="44" width="302" height="6" rx="3" fill="#F1F5F9"/>
      <rect x="24" y="44" width="76" height="6" rx="3" fill="#0284C7"/>

      <!-- Step 01 Active -->
      <rect x="16" y="68" width="318" height="38" rx="8" fill="#F0F9FF"/>
      <text x="28" y="91" class="font-mono" font-size="12" font-weight="600" fill="#0284C7">01.</text>
      <text x="56" y="91" class="font-sans" font-size="12.5" font-weight="600" fill="#0C4A6E">Perfil profesional</text>
      <text x="320" y="91" text-anchor="end" class="font-mono" font-size="11" fill="#059669" font-weight="600">3/3</text>

      <!-- Step 02 -->
      <text x="28" y="133" class="font-mono" font-size="12" fill="#94A3B8">02.</text>
      <text x="56" y="133" class="font-sans" font-size="12.5" fill="#475569">Análisis de tareas</text>
      <text x="320" y="133" text-anchor="end" class="font-mono" font-size="11" fill="#94A3B8">2/4</text>
      <line x1="24" y1="148" x2="326" y2="148" stroke="#F1F5F9"/>

      <!-- Step 03 -->
      <text x="28" y="173" class="font-mono" font-size="12" fill="#94A3B8">03.</text>
      <text x="56" y="173" class="font-sans" font-size="12.5" fill="#475569">Escenarios de adopción</text>
      <text x="320" y="173" text-anchor="end" class="font-mono" font-size="11" fill="#94A3B8">0/3</text>
      <line x1="24" y1="188" x2="326" y2="188" stroke="#F1F5F9"/>

      <!-- Step 04 -->
      <text x="28" y="213" class="font-mono" font-size="12" fill="#94A3B8">04.</text>
      <text x="56" y="213" class="font-sans" font-size="12.5" fill="#475569">Proyección de impactos</text>
      <text x="320" y="213" text-anchor="end" class="font-mono" font-size="11" fill="#94A3B8">0/4</text>

      <!-- Live Telemetry Card -->
      <rect x="0" y="272" width="350" height="248" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
      <text x="24" y="304" class="font-display" font-size="13.5" font-weight="600" fill="#0F172A">Síntesis de parámetros</text>
      <text x="326" y="304" text-anchor="end" class="font-mono" font-size="11.5" fill="#64748B">5/14 respuestas</text>
      <line x1="24" y1="318" x2="326" y2="318" stroke="#F1F5F9"/>

      <g class="font-sans" font-size="12">
        <text x="24" y="344" fill="#64748B">Sector</text>
        <text x="326" y="344" text-anchor="end" font-weight="500" fill="#0F172A">Educación e investigación</text>

        <text x="24" y="376" fill="#64748B">Experiencia previa</text>
        <text x="326" y="376" text-anchor="end" font-weight="500" fill="#0F172A">Intermedio</text>

        <text x="24" y="408" fill="#64748B">Carga rutinaria / creativa</text>
        <text x="326" y="408" text-anchor="end" class="font-mono" font-weight="500" fill="#0F172A">40% · 60%</text>

        <text x="24" y="440" fill="#64748B">Herramientas / barreras</text>
        <text x="326" y="440" text-anchor="end" class="font-mono" font-weight="500" fill="#0F172A">4 · 3</text>

        <text x="24" y="472" fill="#64748B">Horizonte estimado</text>
        <text x="326" y="472" text-anchor="end" font-weight="500" fill="#0F172A">3-6 meses</text>

        <text x="24" y="502" fill="#64748B">Mejora proyectada</text>
        <text x="326" y="502" text-anchor="end" class="font-mono" font-weight="600" fill="#0369A1">+35%</text>
      </g>
    </g>

    <!-- Right Interactive Stage (774px) -->
    <g transform="translate(378, 0)">
      <rect x="0" y="0" width="774" height="520" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>

      <!-- Step Header -->
      <text x="36" y="38" class="font-mono" font-size="11.5" font-weight="500" fill="#0369A1">Dimensión 01 de 04  ·  3 criterios de evaluación</text>
      <text x="36" y="66" class="font-display" font-size="21" font-weight="700" fill="#0F172A">01. Perfil profesional y contexto laboral</text>
      <text x="36" y="90" class="font-sans" font-size="13" fill="#475569">Caracterización del ámbito de desempeño, responsabilidades principales y grado de familiaridad previa con IA.</text>
      <line x1="36" y1="110" x2="738" y2="110" stroke="#E2E8F0"/>

      <!-- Question 01.1 -->
      <text x="36" y="140" class="font-display" font-size="14.5" font-weight="600" fill="#0F172A">
        <tspan class="font-mono" font-size="11.5" fill="#94A3B8">01.1 </tspan>¿En qué sector profesional te desempeñas principalmente?
      </text>

      <!-- Option Grid -->
      <rect x="36" y="156" width="344" height="42" rx="8" fill="#F0F9FF" stroke="#0284C7" stroke-width="1.5"/>
      <text x="52" y="182" class="font-sans" font-size="13" font-weight="600" fill="#082F49">Educación e investigación</text>
      <circle cx="358" cy="177" r="7" fill="#0284C7"/>
      <circle cx="358" cy="177" r="2.5" fill="#FFFFFF"/>

      <rect x="394" y="156" width="344" height="42" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
      <text x="410" y="182" class="font-sans" font-size="13" font-weight="500" fill="#334155">Salud</text>
      <circle cx="716" cy="177" r="7" fill="none" stroke="#CBD5E1" stroke-width="1.5"/>

      <rect x="36" y="208" width="344" height="42" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
      <text x="52" y="234" class="font-sans" font-size="13" font-weight="500" fill="#334155">Tecnología</text>
      <circle cx="358" cy="229" r="7" fill="none" stroke="#CBD5E1" stroke-width="1.5"/>

      <rect x="394" y="208" width="344" height="42" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
      <text x="410" y="234" class="font-sans" font-size="13" font-weight="500" fill="#334155">Sector público</text>
      <circle cx="716" cy="229" r="7" fill="none" stroke="#CBD5E1" stroke-width="1.5"/>

      <line x1="36" y1="272" x2="738" y2="272" stroke="#E2E8F0"/>

      <!-- Question 01.2 -->
      <text x="36" y="302" class="font-display" font-size="14.5" font-weight="600" fill="#0F172A">
        <tspan class="font-mono" font-size="11.5" fill="#94A3B8">01.2 </tspan>Describe tu rol principal y las tareas que realizas habitualmente
      </text>
      <rect x="36" y="318" width="702" height="92" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
      <text x="52" y="344" class="font-sans" font-size="13" fill="#334155">Docencia universitaria de posgrado, dirección de proyectos de investigación aplicada, revisión</text>
      <text x="52" y="366" class="font-sans" font-size="13" fill="#334155">sistemática de literatura y elaboración de artículos científicos e informes técnicos.</text>

      <!-- Footer Navigation -->
      <line x1="36" y1="440" x2="738" y2="440" stroke="#E2E8F0"/>
      <rect x="36" y="460" width="160" height="38" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
      <text x="116" y="484" text-anchor="middle" class="font-sans" font-size="12.5" font-weight="500" fill="#94A3B8">← Dimensión anterior</text>

      <rect x="558" y="460" width="180" height="38" rx="8" fill="#0284C7"/>
      <text x="648" y="484" text-anchor="middle" class="font-sans" font-size="12.5" font-weight="600" fill="#FFFFFF">Siguiente dimensión →</text>
    </g>

  </g>
</svg>
